name: 功能建议
description: 提出新功能、改进现有交互或补充文档
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先搜索已有 Issue，避免重复。若与本项目「零三方依赖、文件级存储、仅 Windows」的定位冲突，请说明理由。

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 账号管理 / 凭证
        - 规则编排 / 配置生成
        - 执行引擎（演练、扫描后确认）
        - 任务中心 / 日志
        - 部署向导 / 环境自检
        - 用户与权限
        - 界面与交互
        - 启动脚本 / 打包
        - 文档
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述当前的做法哪里不顺手，比直接描述方案更有价值
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你希望平台怎么表现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，以及为什么不够好

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考截图、类似工具的做法、场景规模（多少个账号、多少个区域）
